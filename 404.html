<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | James Taljaard</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font: 1rem/1.7 Arial, sans-serif; padding: 1.5rem; }
        main { max-width: 42rem; background: #fff; border: 1px solid #e2e8f0; border-radius: .6rem; padding: clamp(1.5rem, 5vw, 3rem); }
        h1 { line-height: 1.2; }
        .eyebrow { color: #1d4ed8; font-weight: bold; }
        a { color: #1d4ed8; text-underline-offset: .2em; }
        a:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 5px; }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">James Taljaard / Portfolio</p>
        <h1>That page could not be found.</h1>
        <p>The address may have changed, or the link may be incomplete.</p>
        <p><a id="home-link" href="./index.html">Return to the portfolio homepage</a></p>
        <noscript><p>For a deeply nested address, return to the portfolio address you opened originally.</p></noscript>
    </main>
    <script>
        // Keep the home link inside the project on GitHub Pages, including for nested 404 URLs.
        (function () {
            const parts = window.location.pathname.split('/').filter(Boolean);
            const project = window.location.hostname.endsWith('.github.io') ? parts[0] : '';
            document.getElementById('home-link').href = project ? '/' + encodeURIComponent(project) + '/index.html' : '/index.html';
        }());
    </script>
</body>
</html>
